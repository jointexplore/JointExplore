[package]
name = "desktop-container-manager"
version = "1.0.0"
description = "Portable web app container manager"
authors = ["Desktop Container Manager"]
edition = "2021"

[lib]
name = "desktop_container_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

url = "2"
